[project]
name = "email-security-audit"
version = "0.1.0"
description = "CLI for auditing SPF, DMARC, and DKIM posture"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "ESAG Maintainers", email = "security-audit@example.com" }]
license = { text = "MIT" }
dependencies = [
    "dnspython==2.7.0",
    "rich==13.7.1",
]
optional-dependencies = { dev = ["black==24.4.2", "ruff==0.6.8", "pytest==8.3.2"] }

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "UP", "B", "C4", "TID", "RUF"]
ignore = ["E203", "W503"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra"
